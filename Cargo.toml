[package]
name = "bithound"
version = "0.1.0"
authors = ["h4vismat"]
edition = "2021"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.7"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3"
hex = "0.4.3"
hmac = "0.13.0"
rand = "0.9"
reqwest = { version = "0.13.3", features = ["json", "query"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "uuid", "migrate", "macros"] }
subtle = "2.6"
teloxide = "0.17.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.1", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52.3", features = ["full", "test-util"] }
