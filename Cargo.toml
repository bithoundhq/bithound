[package]
name = "bithound"
version = "0.1.0"
authors = ["h4vismat"]
edition = "2021"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
uuid = { version = "1.23.1", features = ["v7", "serde"] }
