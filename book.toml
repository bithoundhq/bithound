[book]
title = "Bithound"
description = "Observability sidecar for Bitcoin infrastructure."
authors = ["bithound contributors"]
language = "en"
src = "docs/src"

[build]
build-dir = "docs/build"
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/bithoundhq/bithound"
edit-url-template = "https://github.com/bithoundhq/bithound/edit/main/docs/src/{path}"
site-url = "/bithound/"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1

[output.linkcheck]
optional = true
